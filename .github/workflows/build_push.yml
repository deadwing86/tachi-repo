name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'core/**'
      - 'common.gradle'
      - 'build.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 65
  IS_PR_CHECK: false

jobs:
  build:
    name: Build extensions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > signingkey.jks

      - name: Build all extensions
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lintKotlinMain -x lintKotlin

      - name: Collect APKs
        run: |
          mkdir -p repo/apk
          find . -name "*.apk" -not -path "./repo/*" | while read apk; do
            dest="repo/apk/$(basename "$apk" | sed 's/-release\.apk/.apk/')"
            cp "$apk" "$dest"
          done

      - name: Add keiyoushi extensions
        run: |
          # Fetch existing APKs from repo branch to avoid re-downloading removed ones
          git fetch origin repo 2>/dev/null || true
          EXISTING=$(git ls-tree -r origin/repo --name-only 2>/dev/null | grep "^apk/" || true)

          KEIYOUSHI_INDEX=$(curl -s "https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json")
          PKGS=(
            "eu.kanade.tachiyomi.extension.all.hentai3"
            "eu.kanade.tachiyomi.extension.all.cosplaytele"
            "eu.kanade.tachiyomi.extension.all.hentaiera"
            "eu.kanade.tachiyomi.extension.all.hentaifox"
            "eu.kanade.tachiyomi.extension.all.hentaihand"
            "eu.kanade.tachiyomi.extension.all.hentaizap"
            "eu.kanade.tachiyomi.extension.all.nhentaicom"
            "eu.kanade.tachiyomi.extension.all.nhentaixxx"
            "eu.kanade.tachiyomi.extension.all.photos18"
            "eu.kanade.tachiyomi.extension.all.xarthunter"
            "eu.kanade.tachiyomi.extension.all.webtoons"
            "eu.kanade.tachiyomi.extension.en.ninehentai"
            "eu.kanade.tachiyomi.extension.en.eighteenporncomic"
            "eu.kanade.tachiyomi.extension.en.allporncomic"
            "eu.kanade.tachiyomi.extension.en.aquamanga"
            "eu.kanade.tachiyomi.extension.en.hentaidex"
            "eu.kanade.tachiyomi.extension.en.hentairead"
            "eu.kanade.tachiyomi.extension.en.infinityscans"
            "eu.kanade.tachiyomi.extension.en.madaradex"
            "eu.kanade.tachiyomi.extension.en.mangahentai"
            "eu.kanade.tachiyomi.extension.en.mangafox"
            "eu.kanade.tachiyomi.extension.en.mangatx"
            "eu.kanade.tachiyomi.extension.en.manhuaplus"
            "eu.kanade.tachiyomi.extension.en.manhuafast"
            "eu.kanade.tachiyomi.extension.en.manhuaplusorg"
            "eu.kanade.tachiyomi.extension.en.toonily"
            "eu.kanade.tachiyomi.extension.en.toonilyme"
            "eu.kanade.tachiyomi.extension.vi.goctruyentranh"
            "eu.kanade.tachiyomi.extension.vi.hentaivnplus"
            "eu.kanade.tachiyomi.extension.vi.nettruyenco"
            "eu.kanade.tachiyomi.extension.vi.truyenhentai18"
          )
          for pkg in "${PKGS[@]}"; do
            apk=$(echo "$KEIYOUSHI_INDEX" | jq -r ".[] | select(.pkg == \"$pkg\") | .apk")
            if [ -z "$apk" ] || [ "$apk" = "null" ]; then
              # Not in keiyoushi anymore — restore from our repo branch if we have it
              cached=$(echo "$EXISTING" | grep "/${pkg//./\\.}-" | head -1)
              if [ -n "$cached" ]; then
                git show origin/repo:"$cached" > "repo/${cached#apk/}" 2>/dev/null && echo "Restored $cached from cache" || true
              else
                echo "WARN: $pkg not found anywhere, skipping"
              fi
            else
              dest="repo/apk/$apk"
              cached_match=$(echo "$EXISTING" | grep "apk/${pkg//./\\.}-" | head -1)
              if [ -n "$cached_match" ] && echo "$EXISTING" | grep -q "apk/$apk"; then
                # Same version already cached — restore from repo branch
                git show origin/repo:"apk/$apk" > "$dest" 2>/dev/null && echo "Cached $apk" || \
                  { curl -sL "https://github.com/keiyoushi/extensions/raw/repo/apk/$apk" -o "$dest" && echo "Downloaded $apk"; }
              else
                curl -sL "https://github.com/keiyoushi/extensions/raw/repo/apk/$apk" -o "$dest" && echo "Downloaded $apk"
              fi
            fi
          done

      - name: Generate index
        run: |
          INSPECTOR_LINK="$(curl -s "https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest" | jq -r '.assets[0].browser_download_url')"
          curl -L "$INSPECTOR_LINK" -o Inspector.jar
          java -jar Inspector.jar "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Generate repo.json
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          FINGERPRINT=$(keytool -list -v -keystore signingkey.jks -alias "$ALIAS" -storepass "$KEY_STORE_PASSWORD" 2>/dev/null \
            | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          cat > repo/repo.json << EOF
          {
            "meta": {
              "name": "Hitomi Repo",
              "website": "https://github.com/${{ github.repository }}",
              "signingKeyFingerprint": "$FINGERPRINT"
            }
          }
          EOF

      - name: Deploy to repo branch
        run: |
          cd repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update repo"
          git push --force "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:repo

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks
